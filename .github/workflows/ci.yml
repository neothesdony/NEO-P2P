name: NEO-P2P CI

on:
  push:
    branches: [main, develop, v0.1.1]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Unit Tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Network invariant gate
        working-directory: .
        run: .github/scripts/check-network-invariant.sh

      # F1 (2026-09-23): the pinned RNS/LXMF fork artifacts are checked into
      # android/thirdparty-repo and resolved from there — no mavenLocal, no
      # fork build, no LAN-only remote. A clean checkout builds unaided.

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :core:test --stacktrace

      - name: Lint check
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # P5/P6.2: architectural gate — only AppModule/ChainMonitor may construct
      # an HTTP client, so every network call goes through the hardened,
      # failover-aware chain monitor.
      - name: Architectural gate (single HTTP chokepoint)
        run: ../.github/scripts/check-http-chokepoint.sh

      # P5: assert the built APK is 16 KB page aligned (SQLCipher + all native
      # libs). Skipped only when zipalign is unavailable on the runner.
      - name: 16 KB page-alignment check
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ZA=""
          if [ -n "$SDK" ]; then
            ZA="$(ls "$SDK"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$ZA" ]; then
            echo "zipalign not found; skipping 16 KB check"
            exit 0
          fi
          "$ZA" -c -P 16 -v 4 "$APK" >/dev/null
          echo "16 KB aligned: $APK"


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-*.html

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  security-audit:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependencies for known vulnerabilities
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: NEO-P2P
          path: android
          format: HTML
          fail_on_cvss: 9
        continue-on-error: true

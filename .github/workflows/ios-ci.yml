name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    
    - name: Setup Fastlane
      run: |
        gem install fastlane -NV
        cd ios
        fastlane init --skip_wizard
    
    - name: Install Dependencies
      run: |
        cd ios
        bundle install
    
    - name: Run Unit Tests
      run: |
        cd ios
        xcodebuild test \
          -scheme neo-p2p \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
          -enableCodeCoverage YES
    
    - name: Build IPA
      run: |
        cd ios
        fastlane beta
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/**/*.ipa

  deploy:
    needs: build
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    
    - name: Setup Fastlane
      run: |
        gem install fastlane -NV
        cd ios
        fastlane init --skip_wizard
    
    - name: Install Dependencies
      run: |
        cd ios
        bundle install
    
    - name: Build and Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      run: |
        cd ios
        fastlane release
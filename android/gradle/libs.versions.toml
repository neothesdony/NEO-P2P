[versions]
agp = "8.7.0"
kotlin = "2.1.0"
compose-bom = "2026.03.00"
hilt = "2.52"
room = "2.7.0"
libp2p = "1.1.0"
libsignal = "0.51.0"
webrtc = "125.0.0"
nostr = "2.1.0"
ldk = "0.1.0"
coroutines = "1.9.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
datastore = "1.1.1"
sqlcipher = "4.5.6"
work = "2.10.0"
ktor = "3.0.3"
tink = "1.15.0"
bip39 = "1.0.6"
serialization = "1.7.3"

[libraries]
# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# AndroidX
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }

# Hilt DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version = "1.2.0" }

# Room (local DB, offline-first)
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DataStore (preferences)
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# SQLCipher (encrypted DB)
sqlcipher = { module = "net.zetetic:android-database-sqlcipher", version.ref = "sqlcipher" }

# P2P — java-libp2p
libp2p-core = { module = "io.libp2p:jvm-libp2p", version.ref = "libp2p" }
libp2p-pubsub = { module = "io.libp2p:pubsub", version.ref = "libp2p" }
libp2p-relay = { module = "io.libp2p:circuit-relay", version.ref = "libp2p" }

# E2EE — Signal Protocol
libsignal = { module = "org.signal:libsignal-client", version.ref = "libsignal" }
libsignal-android = { module = "org.signal:libsignal-android", version.ref = "libsignal" }

# WebRTC (AOSP)
webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "webrtc" }

# Nostr
nostr-android = { module = "com.nostr:nostr-android", version.ref = "nostr" }

# Lightning — LDK
ldk-android = { module = "org.ldk:ldk-android", version.ref = "ldk" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# WorkManager (background sync)
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Ktor (WebSocket client for Nostr)
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Serialization
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# BIP-39 (seed phrase)
bip39 = { module = "io.github.novacrypto:BIP39", version.ref = "bip39" }

# Google Tink (crypto helpers)
tink = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# Debug
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Coturn TURN/STUN Server Config for NEO-P2P
# Used as LAST RESORT when libp2p AutoRelay + STUN fail
# Indonesian carriers: ~95% success rate with TURN

# Server configuration
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=YOUR_PUBLIC_IP

# Performance tuning for mobile users
max-bps=1048576        # 1Mbps per allocation (Indonesian mobile networks)
user-quota=10           # Max users per IP
total-quota=100         # Max total users
stale-nonce=600         # Nonce timeout 10 min

# Relay ports (UDP range for media relay)
min-port=50000
max-port=50010

# Auth — hardcoded, apps ship with these credentials
# Rotate by updating app + relaying infrastructure
user=neop2p:changeme

# Security
fingerprint
no-multicast-peers
no-tcp-relay             # UDP only for relay (better for mobile)
no-stdout-log
syslog

# TURN only (not a full relay hub)
realm=custom-minipc.com
no-tlsv1
no-tlsv1_1

# STUN support (free, no auth needed)
stun-only=0              # Enable both STUN and TURN

# Mobility
mobility
keep-address-rules=true

# Coturn TURN/STUN Server Config for NEO-P2P
# Used as LAST RESORT when libp2p AutoRelay + STUN fail
# Indonesian carriers: ~95% success rate with TURN
#
# RULE: the coturn config parser does NOT support inline comments — a '#'
# after a value is parsed as part of the value and boolean lines with
# trailing comments crash with "Unknown boolean value". ALL comments are
# full-line only. Tested with coturn 4.17.x (coturn/coturn:latest, 2026-08-29).

# Server configuration
listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# external-ip is intentionally NOT set here. The coturn image's default CMD
# passes --external-ip=$(detect-external-ip), which resolves the public IP at
# every container start. A hardcoded external-ip=YOUR_PUBLIC_IP placeholder
# here previously crashed coturn with "error resolving 'YOUR_PUBLIC_IP'" when
# the stack was started outside deploy.sh (exit 255 loop).

# Performance tuning for mobile users
max-bps=1048576
user-quota=10
total-quota=100
stale-nonce=600

# Relay ports (UDP range for media relay)
min-port=50000
max-port=50010

# Auth — apps ship with these credentials
# Rotate by updating app + relaying infrastructure
# Long-term credential mechanism must be explicit or coturn warns every boot.
lt-cred-mech
user=neop2p:changeme

# Security
fingerprint
no-multicast-peers
no-tcp-relay
# Log to stdout inside the container — the image runs with --log-file=stdout;
# no-stdout-log+syslog made `docker logs neop2p-turn` empty even when healthy.
log-file=stdout

# TURN only (not a full relay hub)
realm=custom-minipc.com

# STUN support (free, no auth needed)
stun-only=0

# Mobility with ICE (MICE) support
mobility
# IPv4 default relay address family (replaces the removed keep-address-rules)
allocation-default-address-family=ipv4

# NEO-P2P Relay Infrastructure — Phase 4 (RNS + LXMF) — AMD64 (x86_64)
# Deploy on any x86_64 VPS (e.g. Hetzner, DigitalOcean, AWS EC2)
# One command: docker compose -f docker-compose.amd64.yml up -d
#
# Phase 4: the Nostr relays (strfry x4), libp2p circuit relay, WS relay, and
# coturn were replaced by:
#   - rns-transport: rnsd-kt transport node (TCP server, enableTransport=true)
#   - lxmf-propagation: Python LXMF propagation node (store-and-forward)

networks:
  neo-p2p:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  rns-transport-data:
  lxmf-propagation-data:

services:
  # ─── RNS TRANSPORT NODE ─────────────────────────────────────
  # Routes announces, paths, and links between peers. Phones connect as
  # TCP clients (client-only mode). Port 42000 must be open on the firewall.
  rns-transport:
    build:
      context: ./rns-transport
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: neop2p-rns-transport
    restart: always
    networks:
      - neo-p2p
    ports:
      - "42000:42000"
    volumes:
      - rns-transport-data:/etc/reticulum
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ─── LXMF PROPAGATION NODE ─────────────────────────────────
  # Store-and-forward for offline peers (replaces the WS relay's offline
  # queue + the Nostr relays' durable bus). Python lxmd (the Kotlin fork is
  # client-only for propagation). Shares the RNS transport node's TCP port
  # namespace via the same network; peers reach it through the transport node.
  lxmf-propagation:
    build:
      context: ./lxmf-propagation
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: neop2p-lxmf-propagation
    restart: always
    networks:
      - neo-p2p
    volumes:
      - lxmf-propagation-data:/var/lib/lxmf
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ─── METRICS & MONITORING ───────────────────────────────────
  # Simple health checker that pings all services
  healthchecker:
    image: alpine:latest
    platform: linux/amd64
    container_name: neop2p-health
    restart: always
    # Host network: the container must reach the public IP through HAProxy
    # (ufw blocks bridge-container hairpin) and the backends via 127.0.0.1.
    network_mode: host
    volumes:
      - ./scripts/healthcheck.sh:/healthcheck.sh:ro
    entrypoint: ["/bin/sh", "/healthcheck.sh"]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

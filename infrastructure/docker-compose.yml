# NEO-P2P Relay Infrastructure
# Deploy on Oracle Cloud Free Tier (4 ARM cores, 24GB RAM)
# One command: docker compose up -d

networks:
  neo-p2p:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  strfry-1-data:
  strfry-2-data:
  strfry-3-data:
  strfry-meta-data:
  libp2p-relay-data:
  coturn-data:

# Relay domain is configurable via the RELAY_DOMAIN env var (see .env or shell).
# Defaults to custom-minipc.com if unset.
x-relay-domain: &relay-domain
  RELAY_DOMAIN: ${RELAY_DOMAIN:-custom-minipc.com}

services:
  # ─── NOSTR RELAYS (3 instances for redundancy) ───────────────
  strfry-1:
    image: ghcr.io/hoytech/strfry:latest
    platform: linux/arm64
    container_name: neop2p-nostr-1
    restart: always
    networks:
      - neo-p2p
    ports:
      - "127.0.0.1:7001:8080"   # localhost only; HAProxy terminates TLS on public IP
    volumes:
      - strfry-1-data:/app/strfry-db
      - ./strfry/strfry-1.conf:/app/strfry.conf
      - ./strfry/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      <<: *relay-domain
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  strfry-2:
    image: ghcr.io/hoytech/strfry:latest
    platform: linux/arm64
    container_name: neop2p-nostr-2
    restart: always
    networks:
      - neo-p2p
    ports:
      - "127.0.0.1:7002:8080"   # localhost only; HAProxy terminates TLS on public IP
    volumes:
      - strfry-2-data:/app/strfry-db
      - ./strfry/strfry-2.conf:/app/strfry.conf
      - ./strfry/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      <<: *relay-domain
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  strfry-3:
    image: ghcr.io/hoytech/strfry:latest
    platform: linux/arm64
    container_name: neop2p-nostr-3
    restart: always
    networks:
      - neo-p2p
    ports:
      - "127.0.0.1:7003:8080"   # localhost only; HAProxy terminates TLS on public IP
    volumes:
      - strfry-3-data:/app/strfry-db
      - ./strfry/strfry-3.conf:/app/strfry.conf
      - ./strfry/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      <<: *relay-domain
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── LIBSECP256K1 RELAY (NIP-65 metadata relay) ─────────────
  # Lightweight relay specifically for peer metadata (NIP-65)
  strfry-meta:
    image: ghcr.io/hoytech/strfry:latest
    platform: linux/arm64
    container_name: neop2p-nostr-meta
    restart: always
    networks:
      - neo-p2p
    ports:
      - "127.0.0.1:7004:8080"   # localhost only; HAProxy terminates TLS on public IP
    volumes:
      - ./strfry/strfry-meta.conf:/app/strfry.conf
      - ./strfry/entrypoint.sh:/entrypoint.sh:ro
      - strfry-meta-data:/app/strfry-db  # dedicated volume
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      <<: *relay-domain
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ─── LIBP2P CIRCUIT RELAY v2 ─────────────────────────────────
  libp2p-relay:
    build:
      context: ./libp2p-relay
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: neop2p-libp2p-relay
    restart: always
    networks:
      - neo-p2p
    ports:
      - "4001:4001"    # Circuit Relay
      - "4002:4002"    # Identify / DHT
    volumes:
      - libp2p-relay-data:/data
    environment:
      - RELAY_PORT=4001
      - ADVERTISE_PORT=4002
      - DATA_DIR=/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── WS RELAY (P2P WebSocket transport) ─────────────────────
  ws-relay:
    build:
      context: ./ws-relay
      dockerfile: Dockerfile
    container_name: neop2p-ws-relay
    restart: always
    networks:
      - neo-p2p
    ports:
      - "127.0.0.1:4003:4003"   # localhost only; HAProxy terminates TLS on public IP
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── COTURN TURN/STUN SERVER ────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    platform: linux/arm64
    container_name: neop2p-turn
    restart: always
    networks:
      - neo-p2p
    ports:
      - "3478:3478"        # TURN TCP
      - "3478:3478/udp"    # TURN UDP
      - "5349:5349"        # TURN TLS
      - "50000-50010:50000-50010/udp"  # TURN relay ports
    volumes:
      - coturn-data:/var/lib/coturn
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TZ=Asia/Jakarta
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "turnutils_uclient", "-v", "-t", "-u", "neop2p", "-w", "changeme", "localhost"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 15s

  # ─── METRICS & MONITORING ───────────────────────────────────
  # Simple health checker that pings all services
  healthchecker:
    image: alpine:latest
    platform: linux/arm64
    container_name: neop2p-health
    restart: always
    networks:
      - neo-p2p
    volumes:
      - ./scripts/healthcheck.sh:/healthcheck.sh:ro
    entrypoint: ["/bin/sh", "/healthcheck.sh"]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

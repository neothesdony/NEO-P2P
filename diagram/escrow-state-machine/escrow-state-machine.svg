<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="30" fill="white" font-size="16" font-weight="700" text-anchor="middle">NEO-P2P Trade State Machine</text>
  <text x="500" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">2-of-3 multisig escrow — action-driven, role-aware transitions</text>

  <!-- ============ HAPPY PATH (top) ============ -->
  <!-- PENDING -->
  <rect x="70" y="100" width="120" height="56" rx="28" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">PENDING</text>
  <text x="130" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">offer published</text>

  <!-- MATCHED -->
  <rect x="260" y="100" width="120" height="56" rx="28" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">MATCHED</text>
  <text x="320" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">taker committed</text>

  <!-- FUNDING -->
  <rect x="450" y="100" width="120" height="56" rx="28" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="510" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">FUNDING</text>
  <text x="510" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">await seller deposit</text>

  <!-- FUNDED -->
  <rect x="640" y="100" width="120" height="56" rx="28" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="700" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">FUNDED</text>
  <text x="700" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">BTC in escrow</text>

  <!-- SIGNED -->
  <rect x="830" y="100" width="120" height="56" rx="28" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="890" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">SIGNED</text>
  <text x="890" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">2-of-3 sigs</text>

  <!-- Transition arrows (happy path top row) -->
  <line x1="190" y1="128" x2="255" y2="128" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="222" y="118" fill="#94a3b8" font-size="7" text-anchor="middle">OFFER_TAKEN</text>

  <line x1="380" y1="128" x2="445" y2="128" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="412" y="118" fill="#94a3b8" font-size="7" text-anchor="middle">ESCROW_CREATED</text>

  <line x1="570" y1="128" x2="635" y2="128" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="602" y="118" fill="#94a3b8" font-size="7" text-anchor="middle">ESCROW_FUNDED</text>

  <line x1="760" y1="128" x2="825" y2="128" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="792" y="118" fill="#94a3b8" font-size="7" text-anchor="middle">BUYER_SIGNED / SELLER_SIGNED</text>

  <!-- ============ RELEASE BRANCH (middle) ============ -->
  <!-- RELEASING (buyer only) -->
  <rect x="640" y="260" width="140" height="56" rx="28" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="710" y="288" fill="white" font-size="11" font-weight="600" text-anchor="middle">RELEASING</text>
  <text x="710" y="303" fill="#94a3b8" font-size="8" text-anchor="middle">buyer: awaiting payout</text>

  <!-- COMPLETED -->
  <rect x="830" y="260" width="120" height="56" rx="28" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="890" y="290" fill="white" font-size="11" font-weight="600" text-anchor="middle">COMPLETED</text>
  <text x="890" y="305" fill="#94a3b8" font-size="8" text-anchor="middle">terminal</text>

  <!-- SIGNED -> RELEASING (buyer) -->
  <line x1="890" y1="156" x2="890" y2="200" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="890" y1="200" x2="710" y2="255" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="830" y="222" fill="#60a5fa" font-size="7" text-anchor="middle">RELEASED (buyer)</text>

  <!-- SIGNED -> COMPLETED (seller) -->
  <line x1="950" y1="156" x2="950" y2="230" stroke="#34d399" stroke-width="1.5"/>
  <line x1="950" y1="230" x2="950" y2="255" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="975" y="222" fill="#34d399" font-size="7" text-anchor="middle">RELEASED (seller)</text>

  <!-- RELEASING -> COMPLETED -->
  <line x1="780" y1="288" x2="825" y2="288" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="802" y="278" fill="#94a3b8" font-size="7" text-anchor="middle">PAYOUT_CONFIRMED</text>

  <!-- RELEASING self-retry loop (dashed) -->
  <path d="M 600 290 Q 580 320 620 330 Q 650 335 660 315" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-rose)"/>
  <text x="600" y="350" fill="#fb7185" font-size="7" text-anchor="middle">PAYOUT_FAILED → retry</text>

  <!-- ============ DISPUTE / RESOLUTION BRANCH (bottom) ============ -->
  <!-- DISPUTED -->
  <rect x="100" y="480" width="130" height="56" rx="28" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="165" y="510" fill="white" font-size="11" font-weight="600" text-anchor="middle">DISPUTED</text>
  <text x="165" y="525" fill="#94a3b8" font-size="8" text-anchor="middle">7-day timelock</text>

  <!-- RESOLVING -->
  <rect x="300" y="480" width="140" height="56" rx="28" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="370" y="510" fill="white" font-size="11" font-weight="600" text-anchor="middle">RESOLVING</text>
  <text x="370" y="525" fill="#94a3b8" font-size="8" text-anchor="middle">arbitrator review</text>

  <!-- REFUNDED -->
  <rect x="520" y="480" width="130" height="56" rx="28" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="585" y="510" fill="white" font-size="11" font-weight="600" text-anchor="middle">REFUNDED</text>
  <text x="585" y="525" fill="#94a3b8" font-size="8" text-anchor="middle">funds to buyer</text>

  <!-- CANCELLED -->
  <rect x="730" y="480" width="130" height="56" rx="28" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="795" y="510" fill="white" font-size="11" font-weight="600" text-anchor="middle">CANCELLED</text>
  <text x="795" y="525" fill="#94a3b8" font-size="8" text-anchor="middle">terminal</text>

  <!-- Active states -> DISPUTED (from SIGNED / RELEASING) -->
  <path d="M 760 165 Q 500 380 235 480" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="460" y="420" fill="#fb7185" font-size="7" text-anchor="middle">DISPUTE_OPENED (any active state)</text>

  <!-- DISPUTED -> RESOLVING -->
  <line x1="230" y1="508" x2="295" y2="508" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="262" y="498" fill="#94a3b8" font-size="7" text-anchor="middle">DISPUTE_RESOLVED</text>

  <!-- RESOLVING -> REFUNDED -->
  <line x1="440" y1="508" x2="515" y2="508" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="477" y="498" fill="#94a3b8" font-size="7" text-anchor="middle">REFUNDED</text>

  <!-- RESOLVING -> RELEASING (arbitrator releases to seller) -->
  <path d="M 440 480 Q 550 400 700 320" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="565" y="400" fill="#34d399" font-size="7" text-anchor="middle">RELEASE_TO_SELLER →</text>

  <!-- Any -> CANCELLED (dashed) -->
  <path d="M 630 156 Q 830 380 830 470" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>
  <text x="845" y="360" fill="#94a3b8" font-size="7" text-anchor="middle">CANCELLED</text>

  <!-- Initial state marker -->
  <circle cx="70" cy="128" r="5" fill="#22d3ee"/>
  <circle cx="70" cy="128" r="9" fill="none" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Final states marker -->
  <circle cx="950" cy="288" r="5" fill="#34d399"/>
  <circle cx="950" cy="288" r="9" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="650" cy="508" r="5" fill="#a78bfa"/>
  <circle cx="650" cy="508" r="9" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="860" cy="508" r="5" fill="#94a3b8"/>
  <circle cx="860" cy="508" r="9" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="20" y="620" width="960" height="120" rx="8" fill="rgba(30,41,59,0.3)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="644" fill="white" font-size="11" font-weight="600">Legend</text>

  <rect x="40" y="660" width="120" height="22" rx="11" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="100" y="675" fill="white" font-size="8" text-anchor="middle">Happy path</text>

  <rect x="180" y="660" width="130" height="22" rx="11" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="245" y="675" fill="white" font-size="8" text-anchor="middle">Buyer-only (RELEASING)</text>

  <rect x="330" y="660" width="120" height="22" rx="11" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="390" y="675" fill="white" font-size="8" text-anchor="middle">Dispute path</text>

  <rect x="470" y="660" width="130" height="22" rx="11" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="535" y="675" fill="white" font-size="8" text-anchor="middle">Arbitrator resolution</text>

  <rect x="620" y="660" width="120" height="22" rx="11" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="675" fill="white" font-size="8" text-anchor="middle">Cancel / terminal</text>

  <text x="40" y="712" fill="#94a3b8" font-size="8">Buyer &amp; seller see DIFFERENT statuses on release: buyer → RELEASING, seller → COMPLETED.</text>
  <text x="40" y="726" fill="#94a3b8" font-size="8">RELEASING → COMPLETED only after PAYOUT_CONFIRMED on-chain; retry on PAYOUT_FAILED.</text>
</svg>
